name: .NET CI

on:
  push:
    branches: [ "release" ]

env:
  # Versión específica para consistencia
  DOTNET_VERSION: '6.0.408'

  # Desactiva telemetría
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

  #Ruta de paquetes nuget
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  publish:
    name: Build and Test
    runs-on: ubuntu-latest # Más rápido y económico que Windows

    steps:

      # Analizar el codigo
      - name: Checkout code
        uses: actions/checkout@v4

      #Instalar el sdk de .net
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Paso 3: Restaura dependencias
      - name: Restore dependencies
        run: dotnet restore

      # Paso 5: Genera el paquete NuGet
      - name: Pack the project
        run: dotnet pack --configuration Release --output ./artifacts

      # Paso 6: Publica el paquete en GitHub Packages
      - name: Push to GitHub Packages
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
